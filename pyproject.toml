[project]
name = "lol-checker"
version = "1.0.0"
description = "Bot that fetches League of Legends summoner information."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "altgraph==0.17.4",
    "attrs==23.2.0",
    "certifi==2024.7.4",
    "cffi==1.16.0",
    "h11==0.16.0",
    "idna==3.6",
    "outcome==1.3.0.post0",
    "packaging==23.2",
    "pefile==2023.2.7",
    "prettytable==3.9.0",
    "pycparser==2.21",
    "pyfiglet==1.0.2",
    "pyinstaller==6.3.0",
    "pyinstaller-hooks-contrib==2024.0",
    "pysocks==1.7.1",
    "pywin32-ctypes==0.2.2",
    "selenium==4.17.2",
    "sniffio==1.3.0",
    "sortedcontainers==2.4.0",
    "trio==0.24.0",
    "trio-websocket==0.11.1",
    "typing-extensions==4.9.0",
    "urllib3==2.1.0",
    "wcwidth==0.2.13",
    "wsproto==1.2.0",
]

[project.scripts]
lol-checker = "main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
